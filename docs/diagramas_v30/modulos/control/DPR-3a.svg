<rect x="550" y="784" width="180" height="52" fill="#eef4fb" stroke="#1f2933" stroke-width="1.3" rx="9" ry="9"/><g><text x="640" y="807" font-size="10.5" fill="#1f2933" font-weight="400" text-anchor="middle" xml:space="preserve">Confirmar la autorización</text>
<text x="640" y="820" font-size="10.5" fill="#1f2933" font-weight="400" text-anchor="middle" xml:space="preserve">vigente del vehículo</text></g>
<path d="M640,870 L740,925 L640,980 L540,925 Z" fill="#fdf6e3" stroke="#1f2933" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><g><text x="640" y="928" font-size="9.5" fill="#1f2933" font-weight="400" text-anchor="middle" xml:space="preserve">¿El vehículo está autorizado?</text></g>
<rect x="290" y="1014" width="180" height="52" fill="#eef4fb" stroke="#1f2933" stroke-width="1.3" rx="9" ry="9"/><g><text x="380" y="1037" font-size="10.5" fill="#1f2933" font-weight="400" text-anchor="middle" xml:space="preserve">Autorizar el acceso y registrar</text>
<text x="380" y="1050" font-size="10.5" fill="#1f2933" font-weight="400" text-anchor="middle" xml:space="preserve">la validación manual</text></g>
<rect x="290" y="1134" width="180" height="52" fill="#eef4fb" stroke="#1f2933" stroke-width="1.3" rx="9" ry="9"/><g><text x="380" y="1157" font-size="10.5" fill="#1f2933" font-weight="400" text-anchor="middle" xml:space="preserve">Denegar el acceso y registrar</text>
<text x="380" y="1170" font-size="10.5" fill="#1f2933" font-weight="400" text-anchor="middle" xml:space="preserve">el motivo</text></g>
