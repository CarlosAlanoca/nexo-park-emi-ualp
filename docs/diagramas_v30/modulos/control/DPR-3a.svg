<g><text x="92" y="1516" font-size="10" fill="#37474f" font-weight="400" text-anchor="start" xml:space="preserve">Flujo de control</text></g>
<line x1="207.6" y1="1512" x2="233.6" y2="1512" stroke="#1f2933" stroke-width="1.3" stroke-linecap="round"/>
<g><text x="239.6" y="1477" font-size="10" fill="#37474f" font-weight="400" text-anchor="start" xml:space="preserve">RNF-09: una lectura incierta</text>
<text x="239.6" y="1490" font-size="10" fill="#37474f" font-weight="400" text-anchor="start" xml:space="preserve">nunca autoriza el acceso de</text>
<text x="239.6" y="1503" font-size="10" fill="#37474f" font-weight="400" text-anchor="start" xml:space="preserve">forma automática. RNF-10: la</text>
<text x="239.6" y="1516" font-size="10" fill="#37474f" font-weight="400" text-anchor="start" xml:space="preserve">validación se hace por</text>
<text x="239.6" y="1528" font-size="10" fill="#37474f" font-weight="400" text-anchor="start" xml:space="preserve">inspección física de la placa,</text>
<text x="239.6" y="1541" font-size="10" fill="#37474f" font-weight="400" text-anchor="start" xml:space="preserve">sin reconocimiento facial ni</text>
<text x="239.6" y="1554" font-size="10" fill="#37474f" font-weight="400" text-anchor="start" xml:space="preserve">biometría.</text></g></g>
