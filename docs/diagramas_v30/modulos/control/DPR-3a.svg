<path d="M180,430 L280,485 L180,540 L80,485 Z" fill="#fdf6e3" stroke="#1f2933" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><g><text x="180" y="483" font-size="9.5" fill="#1f2933" font-weight="400" text-anchor="middle" xml:space="preserve">¿El guardia verifica la placa</text>
<text x="180" y="494" font-size="9.5" fill="#1f2933" font-weight="400" text-anchor="middle" xml:space="preserve">dentro del tiempo límite?</text></g>
<rect x="90" y="574" width="180" height="52" fill="#eef4fb" stroke="#1f2933" stroke-width="1.3" rx="9" ry="9"/><g><text x="180" y="597" font-size="10.5" fill="#1f2933" font-weight="400" text-anchor="middle" xml:space="preserve">Escalar el evento a la jefatura</text>
<text x="180" y="610" font-size="10.5" fill="#1f2933" font-weight="400" text-anchor="middle" xml:space="preserve">de seguridad</text></g>
<rect x="870" y="574" width="180" height="52" fill="#eef4fb" stroke="#1f2933" stroke-width="1.3" rx="9" ry="9"/><g><text x="960" y="597" font-size="10.5" fill="#1f2933" font-weight="400" text-anchor="middle" xml:space="preserve">Jefatura recibe el aviso y</text>
<text x="960" y="610" font-size="10.5" fill="#1f2933" font-weight="400" text-anchor="middle" xml:space="preserve">revisa el acceso</text></g>
<rect x="870" y="679" width="180" height="52" fill="#eef4fb" stroke="#1f2933" stroke-width="1.3" rx="9" ry="9"/><g><text x="960" y="702" font-size="10.5" fill="#1f2933" font-weight="400" text-anchor="middle" xml:space="preserve">Registrar la incidencia para</text>
<text x="960" y="715" font-size="10.5" fill="#1f2933" font-weight="400" text-anchor="middle" xml:space="preserve">revisión posterior</text></g>
