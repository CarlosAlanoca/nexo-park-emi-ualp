services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: parkia_emi
      POSTGRES_USER: parkia
      POSTGRES_PASSWORD: parkia2026
    ports:
      - "5432:5432"
    volumes:
      - parkia_pgdata:/var/lib/postgresql/data
      - ./backend/sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/sql/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./backend/sql/03_views_functions.sql:/docker-entrypoint-initdb.d/03_views_functions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkia -d parkia_emi"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-development}
      SEED_DEMO: ${SEED_DEMO:-true}
      DATABASE_URL: postgresql://parkia:parkia2026@db:5432/parkia_emi
      JWT_SECRET: ${JWT_SECRET:-desarrollo-local-nexo-no-usar-en-produccion}
      CAPTCHA_SECRET: ${CAPTCHA_SECRET:-captcha-local-nexo-no-usar-en-produccion}
      CORS_ORIGIN: http://localhost:4000
      ALLOW_BACKUP_COMMANDS: "false"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  parkia_pgdata:
